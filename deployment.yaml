apiVersion: apps/v1
kind: Deployment

metadata:
  name: heart-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: heart-api

  template:
    metadata:
      labels:
        app: heart-api

    spec:
      containers:
      - name: heart-api
        image: us-central1-docker.pkg.dev/project-32301d32-7dfb-43f1-b1a/iris-repo/heart-api:latest
        ports:
        - containerPort: 8080
