name: OPPE2 CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-32301d32-7dfb-43f1-b1a
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: iris-repo
  IMAGE_NAME: heart-api
  CLUSTER_NAME: iris-cluster
  CLUSTER_LOCATION: us-central1-a

jobs:

  test-build-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

    

      - name: Explainability Test
        run: |
          python explainability.py

  

      - name: Fairness Test
        run: |
          python fairness.py

      - name: Train Model
        run: |
          mkdir -p models
          python train.py

    

      - name: Drift Detection
        run: |
          python drift.py

    

      - name: Build Docker Image
        run: |
          docker build -t heart-api .

     

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/58620345939/locations/global/workloadIdentityPools/github-pool/providers/github-weekly-provider
          service_account: github-actions@project-32301d32-7dfb-43f1-b1a.iam.gserviceaccount.com

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      

      - name: Build Registry Image
        run: |
          docker build \
          -t us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push \
          us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

     

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/heart-api \
          heart-api=us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Apply Kubernetes Files
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl apply -f hpa.yaml

      - name: Wait For Rollout
        run: |
          kubectl rollout status deployment/heart-api

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get svc
          kubectl get hpa
