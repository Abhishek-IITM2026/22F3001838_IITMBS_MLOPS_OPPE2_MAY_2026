name: OPPE2 CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-32301d32-7dfb-43f1-b1a
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: heart-repo
  IMAGE_NAME: heart-api

  CLUSTER_NAME: heart-cluster
  CLUSTER_LOCATION: us-central1-a

jobs:

  test-build-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #################################################
      # Train Model
      #################################################

      - name: Train Model
        run: |
          mkdir -p models
          python train.py

      - name: Verify Model Artifact
        run: |
          ls -lh models/model.pkl

      #################################################
      # Deliverable 2 - Explainability
      #################################################

      - name: Explainability
        run: |
          python explainability.py

      - name: Verify SHAP Output
        run: |
          ls -lh shap_summary.png

      #################################################
      # Deliverable 3 - Fairness
      #################################################

      - name: Fairness Testing
        run: |
          python fairness.py

      #################################################
      # Deliverable 7 - Drift Detection
      #################################################

      - name: Drift Detection
        run: |
          python drift.py

      #################################################
      # Authenticate to GCP
      #################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/58620345939/locations/global/workloadIdentityPools/github-pool/providers/github-weekly-provider
          service_account: github-actions@project-32301d32-7dfb-43f1-b1a.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      #################################################
      # Docker Build & Push
      #################################################

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      #################################################
      # Deploy to GKE
      #################################################

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/heart-api \
          heart-api=us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} || true

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl apply -f hpa.yaml

      - name: Wait For Rollout
        run: |
          kubectl rollout status deployment/heart-api --timeout=300s

      #################################################
      # Deployment Verification
      #################################################

      - name: Verify Pods
        run: |
          kubectl get pods -o wide

      - name: Verify Services
        run: |
          kubectl get svc

      - name: Verify HPA
        run: |
          kubectl get hpa

      - name: Verify Deployment
        run: |
          kubectl describe deployment heart-api

      - name: Wait For External IP
        run: |
          for i in {1..30}; do
            EXTERNAL_IP=$(kubectl get svc heart-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$EXTERNAL_IP" ]; then
              echo "External IP: $EXTERNAL_IP"
              exit 0
            fi

            echo "Waiting for External IP..."
            sleep 10
          done

          echo "Timed out waiting for LoadBalancer IP"
          exit 1
